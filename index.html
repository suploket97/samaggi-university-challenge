<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Samaggi University Challenge — Live Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<!-- Premium game-show scoreboard digit font for the Odometer override below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- Odometer.js: rolling digit animation for the scoreboard. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap');
  html,body{height:100%;}
  /* Prevents double-tap-to-zoom and the resulting gesture-recognition lag on
     mobile browsers — paired with 'touchstart' buzzer handling below, this is
     what actually removes the ~300ms tap delay on a phone. */
  html,body{touch-action:manipulation;}
  body{font-family:'Inter',system-ui,sans-serif;background:#0a0a0c;}
  .font-display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.03em;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:999px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .chroma-mode{background:#00ff00 !important;}
  @keyframes buzzGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.55), inset 0 0 0 3px rgba(250,204,21,.9);}
    50%{box-shadow:0 0 55px 14px rgba(250,204,21,.65), inset 0 0 0 3px rgba(250,204,21,.9);}
  }
  .buzz-glow{animation:buzzGlow 0.9s ease-in-out infinite;}
  @keyframes speakPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .speak-pulse{animation:speakPulse 1.1s ease-in-out infinite;}
  @keyframes softPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .soft-pulse{animation:softPulse 1.6s ease-in-out infinite;}
  @keyframes popIn{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .pop-in{animation:popIn .25s ease-out;}
  .btn-press:active{transform:scale(0.96);}
  .buzzer-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;}
  .fade-in{animation:fadeIn .35s ease-out;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .scrollbar-thin{scrollbar-width:thin;}

  /* ---- Odometer: inherit scoreboard typography, avoid layout shift/jitter ---- */
  .odometer.odometer-theme-default{
    display:inline-block;
    font-family:'Bebas Neue',sans-serif !important;
    font-size:inherit !important;
    line-height:1 !important;
    color:inherit !important;
    vertical-align:baseline;
  }
  .odometer.odometer-theme-default .odometer-digit .odometer-value{
    font-family:'Bebas Neue',sans-serif !important;
    color:inherit !important;
  }
  .score-slot{display:inline-block;text-align:right;}

  /* ---- Massive, high-visibility game-show scoreboard digits: a fixed-min-width,
     high-contrast dark block with a clean border and bold text-shadow "pop",
     so the numbers stay crystal clear under bright auditorium/projector light.
     Odometer.js rolls the digits inside the same element, so the box's own
     min-width (in ch, scaled to the mega font-size) keeps 1-, 2- and 3-digit
     scores from ever shifting the layout or clipping while it flips. ---- */
  .score-box{
    background:#000000;
    border:4px solid rgba(255,255,255,0.18);
    border-radius:1.75rem;
    padding:1.5rem 3rem; /* plenty of internal padding, well beyond px-8 py-4 */
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 36px rgba(0,0,0,0.6);
    transition:border-color .2s ease;
  }
  .score-box.score-box-active{border-color:rgba(252,211,77,0.85);box-shadow:0 0 40px rgba(252,211,77,0.25),0 10px 36px rgba(0,0,0,0.6);} /* amber-300, buzzed-in team */
  .score-mega{
    font-weight:900;
    font-size:clamp(6rem, 12vw, 11rem); /* never smaller than text-8xl (6rem), scales well past text-9xl on big screens */
    line-height:1;
    min-width:2.2ch;
    display:inline-block;
    text-align:center;
    white-space:nowrap;
    text-shadow:0 4px 20px rgba(0,0,0,0.85), 0 0 40px rgba(255,255,255,0.16);
  }
  .score-mega-compact{
    font-weight:900;
    text-shadow:0 2px 10px rgba(0,0,0,0.75);
  }

  /* ---- Force Odometer.js digits to render at massive, giant game-show sizes
     in a premium high-visibility monospace Google Font, overriding the
     library's own theme CSS (loaded in <head>) which otherwise shrinks the
     digits back down. Kept exactly as specified: ---- */
  .odometer.odometer-auto-theme,
  .odometer.odometer-theme-minimal {
      font-size: 8rem !important; /* Force massive text size */
      line-height: 1 !important;
      font-weight: 900 !important;
      font-family: 'Share Tech Mono', monospace !important; /* Premium Game Show Digit Font */
  }

  /* Ensure the rolling digit containers have enough height and layout spacing */
  .odometer.odometer-auto-theme .odometer-digit,
  .odometer.odometer-theme-minimal .odometer-digit {
      height: 8rem !important;
      padding: 0 4px !important;
  }

  /* This build actually loads Odometer's "default" theme (see the CDN
     stylesheet in <head> and the `theme: 'default'` option in syncOdometers()),
     not "auto"/"minimal" — so the exact block above is included as specified,
     and this equivalent override is what actually takes effect on our markup.
     It's scoped to the full-size Stage/Spectator scoreboard (.score-mega) only,
     so the slim Compact Banner Mode strip keeps its own smaller digits and
     isn't blown out to 8rem inside its fixed 112px height. ---- */
  .score-mega.odometer.odometer-theme-default{
      font-size:8rem !important;
      line-height:1 !important;
      font-weight:900 !important;
      font-family:'Share Tech Mono', monospace !important; /* Premium Game Show Digit Font */
  }
  .score-mega.odometer.odometer-theme-default .odometer-digit{
      height:8rem !important;
      padding:0 4px !important;
  }
  .score-mega.odometer.odometer-theme-default .odometer-digit .odometer-value{
      font-family:'Share Tech Mono', monospace !important; /* Premium Game Show Digit Font — fixed-width, so digits never shift mid-roll */
  }

  /* ---- Sudden death / alert flash ---- */
  @keyframes alertFlash{0%,100%{opacity:1;}50%{opacity:.45;}}
  .alert-flash{animation:alertFlash 0.9s ease-in-out infinite;}

  /* ---- Confetti (celebration screen) ---- */
  .confetti-piece{
    position:absolute;top:-5vh;width:10px;height:14px;opacity:0.9;border-radius:2px;
    animation-name:confettiFall;animation-timing-function:linear;animation-iteration-count:infinite;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(115vh) rotate(360deg);opacity:0.85;}
  }

  /* ---- End-of-Game Celebration: tournament-tier visual themes ----
     CASE A (Qualifications/Quarterfinals/Semifinals): a glowing border flash
     around the whole screen, colored to the winning team's primary color via
     the --glow-color custom property set inline on the ceremony container. ---- */
  @keyframes glowBorderFlash{
    0%,100%{box-shadow:inset 0 0 0 8px var(--glow-color, #f59e0b), 0 0 90px 12px var(--glow-color, #f59e0b);}
    50%{box-shadow:inset 0 0 0 8px transparent, 0 0 0 0 transparent;}
  }
  .glow-border-flash{animation:glowBorderFlash 1.1s ease-in-out infinite;}

  /* CASE B (Third-Place Playoff): floating metallic-bronze particles rising
     up the screen, plus a bronze text-shadow shimmer on the banner text. ---- */
  @keyframes bronzeFloat{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    12%{opacity:1;}
    100%{transform:translateY(-110vh) rotate(360deg);opacity:0;}
  }
  .bronze-particle{
    position:absolute;bottom:-5vh;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #e8b27a, #CD7F32 55%, #8b5a2b 100%);
    box-shadow:0 0 10px rgba(205,127,50,0.7);
    animation-name:bronzeFloat;animation-timing-function:linear;animation-iteration-count:infinite;
  }
  @keyframes shimmerBronze{
    0%,100%{text-shadow:0 0 20px rgba(205,127,50,.85), 0 0 45px rgba(205,127,50,.55);}
    50%{text-shadow:0 0 38px rgba(205,127,50,1), 0 0 75px rgba(205,127,50,.8);}
  }
  .bronze-shimmer-text{animation:shimmerBronze 1.4s ease-in-out infinite;}

  /* CASE C (Grand Finals): a denser field of floating gold star/trophy
     particles (larger, faster, brighter than Bronze's) plus a gold text-shadow
     shimmer on the championship banner. ---- */
  @keyframes goldFloat{
    0%{transform:translateY(0) rotate(0deg) scale(1);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(-118vh) rotate(420deg) scale(1.2);opacity:0;}
  }
  .gold-particle{
    position:absolute;bottom:-5vh;line-height:1;
    filter:drop-shadow(0 0 10px rgba(255,215,0,0.85));
    animation-name:goldFloat;animation-timing-function:linear;animation-iteration-count:infinite;
  }
  @keyframes shimmerGold{
    0%,100%{text-shadow:0 0 25px rgba(255,215,0,.9), 0 0 60px rgba(255,215,0,.6);}
    50%{text-shadow:0 0 48px rgba(255,215,0,1), 0 0 95px rgba(255,215,0,.9);}
  }
  .gold-shimmer-text{animation:shimmerGold 1.2s ease-in-out infinite;}

  /* ---- Compact Banner Mode (Stage/Spectator) — slim top-of-projector strip ---- */
  .compact-shell{height:112px;max-height:112px;overflow:hidden;}
  .compact-row{flex-direction:row !important;align-items:center;}
  .compact-roster{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;}
  .compact-roster::-webkit-scrollbar{display:none;}

  /* ---- qrcodejs renders an <img> (or <canvas>/<table> fallback) inside the
     container we hand it — force whatever it produces to fill our 120x120 slot. ---- */
  #qr-canvas canvas, #qr-canvas img, #qr-canvas table{width:120px !important;height:120px !important;}
</style>
</head>
<body class="min-h-screen text-white">
<div id="app" class="min-h-screen"></div>

<script>
/* =========================================================================
   SAMAGGI UNIVERSITY CHALLENGE — SERVERLESS P2P QUIZ SYSTEM
   Single-file build. Roles (via ?room=ID&role=...):
     stage      -> the PeerJS host device AND the main scoreboard display
     spectator  -> read-only mirror of the Stage View ("View Only"); any
                   number of these can connect at once
     admin      -> Controller / tech-crew panel
     host       -> Quiz Master / Question Operator podium display
     player     -> mobile buzzer client
   All game state (scores, buzzers, timer, bonus progress, question index,
   match/sudden-death status) lives on the Stage device and is broadcast to
   every connected device over PeerJS WebRTC data channels.
   ========================================================================= */

/* ---------------------------- small utilities --------------------------- */

// Tournament Round Selector — the fixed list of rounds the Admin can pick
// from. Order matters: it's also the dropdown's display order. The exact
// strings double as the round's display label everywhere in the app.
const TOURNAMENT_ROUNDS = ['Qualifications', 'Quarterfinals', 'Semifinals', 'Third-Place Playoff', 'Grand Finals'];

const ID_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I ambiguity
function makeRoomId(len = 5) {
  let s = '';
  for (let i = 0; i < len; i++) s += ID_CHARS[Math.floor(Math.random() * ID_CHARS.length)];
  return s;
}
function uid() {
  return 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}
function baseUrl() {
  return window.location.origin + window.location.pathname;
}
function joinUrl(room, role) {
  return `${baseUrl()}?room=${encodeURIComponent(room)}&role=${role}`;
}
function fmtTime(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

/* ------------------------------ audio synth ------------------------------ */

let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Soft-clip waveshaper curve, used only on the "wrong" buzzer to give it a
// heavier, slightly distorted amplitude character (a classic tanh soft-clip).
function makeDistortionCurve(amount) {
  const n = 1024;
  const curve = new Float32Array(n);
  const k = amount;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
  }
  return curve;
}

// Master synthesized sound-effects engine. All game-show audio funnels
// through this single dispatcher: playSound('buzz' | 'correct' | 'wrong' | 'gong').
function playSound(kind) {
  try {
    const c = ctx();
    if (kind === 'buzz') {
      // Harsh game-show lockout buzzer: a low sawtooth fundamental (~135Hz)
      // stacked with a square wave detuned +5 cents for a fat, heavy TV-buzzer
      // tone, under a sharp attack / fast exponential decay with a short tail.
      const g = c.createGain();
      g.connect(c.destination);
      const t0 = c.currentTime;

      const saw = c.createOscillator();
      saw.type = 'sawtooth';
      saw.frequency.setValueAtTime(135, t0);
      saw.connect(g);

      const sq = c.createOscillator();
      sq.type = 'square';
      sq.frequency.setValueAtTime(135, t0);
      sq.detune.setValueAtTime(5, t0); // +5 cents — fattens the tone
      sq.connect(g);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.015);       // sharp attack
      g.gain.exponentialRampToValueAtTime(0.02, t0 + 0.4);         // punchy fast decay
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);      // short clean tail

      saw.start(t0); sq.start(t0);
      saw.stop(t0 + 0.6); sq.stop(t0 + 0.6);

    } else if (kind === 'correct') {
      // Clear "ping-pong" / ding-dong bell: E5 immediately followed by A5
      // ~120ms later, each ringing out with a smooth 0.8s exponential decay
      // like a struck metal bell / xylophone bar.
      const ring = (freq, startAt, type) => {
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, startAt);
        g.gain.setValueAtTime(0.0001, startAt);
        g.gain.exponentialRampToValueAtTime(0.32, startAt + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.8);
        o.connect(g); g.connect(c.destination);
        o.start(startAt); o.stop(startAt + 0.85);
      };
      const t0 = c.currentTime;
      ring(659.25, t0, 'sine');           // E5
      ring(880.00, t0 + 0.12, 'triangle'); // A5, ~120ms later

    } else if (kind === 'wrong') {
      // Heavy "thud" / error buzzer: a low 80Hz square drone plus a sawtooth
      // pitch-glide sweeping 100Hz -> 50Hz over 0.5s, run through a soft-clip
      // waveshaper for a slightly distorted, unmistakably-wrong amplitude.
      const shaper = c.createWaveShaper();
      shaper.curve = makeDistortionCurve(18);
      shaper.oversample = '2x';
      const g = c.createGain();
      shaper.connect(g);
      g.connect(c.destination);
      const t0 = c.currentTime;

      const drone = c.createOscillator();
      drone.type = 'square';
      drone.frequency.setValueAtTime(80, t0);
      drone.connect(shaper);

      const glide = c.createOscillator();
      glide.type = 'sawtooth';
      glide.frequency.setValueAtTime(100, t0);
      glide.frequency.exponentialRampToValueAtTime(50, t0 + 0.5);
      glide.connect(shaper);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.42, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);

      drone.start(t0); glide.start(t0);
      drone.stop(t0 + 0.6); glide.stop(t0 + 0.6);

    } else if (kind === 'gong') {
      // Deep, resonant "gong" — a stack of low sine/triangle partials with a
      // long exponential decay, meant to mimic a struck metal gong at match end.
      const partials = [
        { f: 55,  type: 'sine',     gain: 0.55 },
        { f: 82,  type: 'triangle', gain: 0.35 },
        { f: 110, type: 'sine',     gain: 0.30 },
        { f: 164, type: 'triangle', gain: 0.20 },
        { f: 233, type: 'sine',     gain: 0.12 },
      ];
      partials.forEach((p) => {
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = p.type;
        o.frequency.setValueAtTime(p.f, c.currentTime);
        o.frequency.exponentialRampToValueAtTime(p.f * 0.92, c.currentTime + 3.5);
        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(p.gain, c.currentTime + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 3.6);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + 3.7);
      });
    }
  } catch (e) { /* audio unavailable */ }
}

// Picture/image rendering has been removed entirely — Picture and Audio
// rounds are now presented on external slides/software. This app only tracks
// *when* to cue the crew (see the Media Automation Scheduler) and never hosts
// or displays any media asset itself.

/* ------------------------------ networking -------------------------------- */
// NOTE: this build reads questions from a printed paper script and manages
// picture/audio assets through external presentation software (PowerPoint,
// Keynote, a soundboard, etc). No question text/answer bank is loaded into
// the app — only a plain running "Question Number" counter is synced, so the
// Admin and Quiz Master screens can stay one step ahead without ever
// displaying question content itself.

const Net = {
  role: null,          // 'host' | 'client'   (PeerJS role — NOT the app-level "role")
  peer: null,
  hostConn: null,       // client -> connection to host
  conns: {},            // host -> { peerId: DataConnection }
  onData: null,
  onConnChange: null,
  reconnecting: false,
};

function sendTo(peerId, data) {
  const c = Net.conns[peerId];
  if (c && c.open) { try { c.send(data); } catch (e) {} }
}
function broadcast(data) {
  Object.values(Net.conns).forEach((c) => { if (c.open) { try { c.send(data); } catch (e) {} } });
}
function sendToHost(data) {
  if (Net.hostConn && Net.hostConn.open) { try { Net.hostConn.send(data); } catch (e) {} }
}
// The buzz-in is the single most latency-sensitive message in the whole app,
// so it skips the usual JSON-object envelope entirely and sends the raw
// one-character string 'B' — the smallest possible WebRTC data-channel
// payload — to maximize throughput and minimize serialization overhead.
function sendBuzzToHost() {
  if (Net.hostConn && Net.hostConn.open) { try { Net.hostConn.send('B'); } catch (e) {} }
}

function startHost(roomId, cb) {
  Net.role = 'host';
  const peer = new Peer(roomId, { debug: 0 });
  Net.peer = peer;
  peer.on('open', (id) => { cb && cb(null, id); });
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      Net.conns[conn.peer] = conn;
      Net.onConnChange && Net.onConnChange();
      // Immediately hand the new device (admin / player / spectator / quiz master)
      // the full, current game state so it is instantly in sync.
      Net.onData && Net.onData({ __fromPeer: conn.peer, __justConnected: true });
    });
    conn.on('data', (data) => {
      // Fast path: a bare 'B' string is the minimal-payload buzz-in message
      // (see sendBuzzToHost) — handle it directly instead of spreading a
      // string into an object, which would silently produce garbage.
      if (data === 'B') { Net.onData && Net.onData({ type: 'player:buzz', __fromPeer: conn.peer }); return; }
      Net.onData && Net.onData({ ...data, __fromPeer: conn.peer });
    });
    conn.on('close', () => {
      delete Net.conns[conn.peer];
      Net.onData && Net.onData({ __fromPeer: conn.peer, __disconnected: true });
      Net.onConnChange && Net.onConnChange();
    });
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', (err) => {
    if (String(err).includes('unavailable-id')) {
      cb && cb(err, null);
    }
  });
}

function startClient(roomId, opts) {
  opts = opts || {};
  Net.role = 'client';
  const peer = new Peer(undefined, { debug: 0 });
  Net.peer = peer;
  let attempts = 0;

  function connectToHost() {
    const conn = peer.connect(roomId, { reliable: true });
    Net.hostConn = conn;
    conn.on('open', () => {
      attempts = 0;
      Net.reconnecting = false;
      opts.onOpen && opts.onOpen();
    });
    conn.on('data', (data) => { Net.onData && Net.onData(data); });
    conn.on('close', () => {
      Net.reconnecting = true;
      opts.onClose && opts.onClose();
      retry();
    });
    conn.on('error', () => { Net.reconnecting = true; opts.onClose && opts.onClose(); retry(); });
  }
  function retry() {
    attempts++;
    const delay = Math.min(4000, 500 * attempts);
    setTimeout(() => { if (Net.role === 'client') connectToHost(); }, delay);
  }

  peer.on('open', () => connectToHost());
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', () => { opts.onClose && opts.onClose(); });
}

/* ------------------------------- game state -------------------------------- */

function freshTeam(name) { return { name, score: 0, players: [] }; }
function freshBonus() { return { active: false, team: null, count: 0, nominatedId: null, nominatedName: null }; }
function freshTimer(totalSeconds) {
  return { totalSeconds: totalSeconds, remainingSeconds: totalSeconds, running: false };
}
function initialState(roomId) {
  return {
    roomId,
    teams: { A: freshTeam('Team A'), B: freshTeam('Team B') },
    phase: 'starter',            // 'starter' | 'bonus'
    currentBuzz: null,           // { team, playerId, playerName, t }
    buzzLockedAll: false,
    lockoutTeams: { A: false, B: false },
    bonus: freshBonus(),
    connectedCount: 0,
    timer: freshTimer(15 * 60),
    suddenDeath: false,
    matchOver: false,
    winner: null,                // 'A' | 'B' | null
    questionNumber: 1,           // plain running counter — no text/answer bank
    // Time-Based Picture & Audio Round Scheduler — a list of admin-configured
    // triggers keyed off the Master Match Timer's remainingSeconds countdown.
    mediaSchedule: [],           // [{ id, atSeconds, kind:'picture'|'audio', assetIndex, fired, dismissed }]
    mediaWarning: null,          // transient: { id, kind, assetIndex, atSeconds } — 30s-out amber banner
    mediaAlert: null,            // transient: { id, kind, assetIndex, atSeconds } — exact-fire red banner
    // Tournament Round Selector — set on Admin, broadcast to every connected
    // device, and used to pick the End-of-Game Celebration's visual tier.
    tournamentRound: TOURNAMENT_ROUNDS[0], // 'Qualifications' | 'Quarterfinals' | 'Semifinals' | 'Third-Place Playoff' | 'Grand Finals'
  };
}

let state = null;          // authoritative on host, mirrored on clients
let myRole = null;         // 'stage' | 'spectator' | 'admin' | 'host' (quiz master) | 'player'
let myRoomId = null;
let myPlayer = null;       // { team, playerId, playerName, isCaptain } — player view only
let clientLinkStatus = 'connecting'; // 'connecting' | 'connected' | 'reconnecting'
let stageChroma = (localStorage.getItem('uc_chroma') === '1');
let stageCompact = (localStorage.getItem('uc_compact') === '1'); // Compact Banner Mode — local display choice
let hostTimerIntervalId = null;

// --- Admin-only local "draft" state -----------------------------------------
// The Admin screen re-renders every second (the timer tick broadcasts a fresh
// `state` from the host), which would otherwise wipe out whatever the crew is
// mid-typing into the roster/name fields or the scheduler's add-trigger form.
// These drafts are the actual source of truth for those inputs' values; they
// are seeded once from `state` and from then on only change from local typing
// or an explicit "Reload from Stage" / successful "Add Trigger" action — never
// from an incoming broadcast — so editing survives re-renders untouched.
let rosterDraft = { A: null, B: null }; // { name, rosterText, captainId } per team, or null = not yet seeded
let schedDraft = { atMinutes: '', atSeconds: '', kind: 'picture', assetIndex: '0' };

function ensureRosterDraft() {
  ['A', 'B'].forEach((tk) => {
    if (!rosterDraft[tk] && state) {
      const team = state.teams[tk];
      rosterDraft[tk] = {
        name: team.name,
        rosterText: team.players.map((p) => p.name).join('\n'),
        captainId: (team.players.find((p) => p.isCaptain) || {}).id || null,
      };
    }
  });
}

// Saves and restores focus + text-cursor position across a full app.innerHTML
// rebuild, so a re-render triggered mid-keystroke (by an incoming state
// broadcast) doesn't kick the crew's cursor out of the field they're typing in.
function captureFocus() {
  const el = document.activeElement;
  if (!el || el === document.body || !el.id) return null;
  const saved = { id: el.id, selStart: null, selEnd: null };
  if ('selectionStart' in el) {
    try { saved.selStart = el.selectionStart; saved.selEnd = el.selectionEnd; } catch (e) { /* not a text control */ }
  }
  return saved;
}
function restoreFocus(saved) {
  if (!saved) return;
  const el = document.getElementById(saved.id);
  if (!el) return;
  el.focus();
  if (saved.selStart != null && 'setSelectionRange' in el) {
    try { el.setSelectionRange(saved.selStart, saved.selEnd); } catch (e) { /* not a text control */ }
  }
}

/* ------------------------------ host reducers ------------------------------ */

function findPlayerByConn(peerId) {
  for (const tk of ['A', 'B']) {
    const p = state.teams[tk].players.find((pl) => pl.connPeerId === peerId);
    if (p) return { team: tk, player: p };
  }
  return null;
}

// Clears bonus state, unlocks BOTH teams' buzzers, hides the picture round,
// and (optionally) advances the backstage Question Number counter.
//   incrementQuestion=true  -> used by [Skip / No Answer] and by the
//                               automatic 3/3 bonus-round completion: the
//                               question is considered "done", move on.
//   incrementQuestion=false -> used by [Manual Override / Force Reset]: a
//                               panic button that must NOT change the
//                               question number (or any score).
function freshStarterRound(incrementQuestion) {
  state.phase = 'starter';
  state.currentBuzz = null;
  state.buzzLockedAll = false;
  state.lockoutTeams = { A: false, B: false };
  state.bonus = freshBonus();
  if (incrementQuestion) state.questionNumber += 1;
}

function advanceBonusCounter() {
  state.bonus.count += 1;
  if (state.bonus.count >= 3) {
    // The 3rd bonus question just resolved — automatically return to a fresh
    // Starter Round (no manual reset needed) and move the counter on.
    freshStarterRound(true);
  }
}

// Shared by the two "wrong answer" buttons: [Interrupt Incorrect (-5)] and
// [Starter Incorrect (0)]. Either way, the buzzing team gets a ONE-SHOT
// lockout for the rest of this question (they cannot buzz again), while the
// OTHER team's buzzers stay active so they still get their attempt.
function handleStarterWrong(deduction) {
  if (!state.currentBuzz || state.matchOver) return false;
  const t = state.currentBuzz.team;
  const other = t === 'A' ? 'B' : 'A';
  if (deduction) state.teams[t].score -= deduction;
  playSound('wrong');
  if (state.suddenDeath) {
    // Critical Sudden Death rule: ANY wrong answer immediately hands the
    // match to the OPPOSING team — no further questions needed.
    endMatch(other);
  } else {
    state.lockoutTeams[t] = true;   // Team t: one-shot lockout for this question
    state.currentBuzz = null;
    state.buzzLockedAll = false;    // Team `other` remains active to attempt
  }
  return true;
}

function endMatch(winnerKey) {
  state.matchOver = true;
  state.winner = winnerKey;
  state.timer.running = false;
  state.phase = 'starter';
  state.currentBuzz = null;
  state.buzzLockedAll = true;
  state.bonus = freshBonus();
  state.suddenDeath = false;
}

function hostHandleData(msg) {
  if (msg.__disconnected) {
    const found = findPlayerByConn(msg.__fromPeer);
    if (found) found.player.connPeerId = null;
    pushState();
    return;
  }
  if (msg.__justConnected) {
    sendTo(msg.__fromPeer, { type: 'state', state });
    return;
  }
  // Admin-led "Force New Room" redirection — a raw { action: "FORCE_NEW_ROOM" }
  // payload (no envelope 'type', per spec) sent straight to the Host. The Host
  // mints the one brand-new Room ID everyone will use, broadcasts it to every
  // currently connected screen (Admin, Spectator, Quiz Master, Player) so each
  // one redirects itself into that exact room, then reloads itself into that
  // same room a beat later — so the whole crew lands in the next match's
  // lobby together, with nobody guessing at a room ID that doesn't exist yet.
  if (msg.action === 'FORCE_NEW_ROOM') {
    const newRoomId = makeRoomId();
    broadcast({ type: 'redirectToRoom', roomId: newRoomId });
    setTimeout(() => {
      window.location.href = joinUrl(newRoomId, 'stage');
    }, 200);
    return;
  }
  switch (msg.type) {
    case 'admin:hello':
      sendTo(msg.__fromPeer, { type: 'state', state });
      break;

    case 'admin:setTeamName':
      state.teams[msg.team].name = (msg.name || '').trim() || (msg.team === 'A' ? 'Team A' : 'Team B');
      pushState();
      break;

    case 'admin:setRoster': {
      const team = state.teams[msg.team];
      const oldByName = {};
      team.players.forEach((p) => { oldByName[p.name.toLowerCase()] = p; });
      const names = msg.names.map((n) => n.trim()).filter(Boolean);
      const seen = new Set();
      const newPlayers = [];
      names.forEach((name) => {
        const key = name.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const existing = oldByName[key];
        newPlayers.push(existing ? existing : { id: uid(), name, isCaptain: false, connPeerId: null });
      });
      team.players = newPlayers;
      pushState();
      break;
    }

    case 'admin:setCaptain': {
      const team = state.teams[msg.team];
      team.players.forEach((p) => { p.isCaptain = (p.id === msg.playerId); });
      pushState();
      break;
    }

    case 'admin:adjustScore':
      state.teams[msg.team].score += msg.delta;
      pushState();
      break;

    case 'admin:setScoreAbsolute':
      if (Number.isFinite(msg.value)) {
        state.teams[msg.team].score = Math.round(msg.value);
        pushState();
      }
      break;

    case 'admin:starterCorrect':
      if (state.currentBuzz && !state.matchOver) {
        const t = state.currentBuzz.team;
        state.teams[t].score += 10;
        playSound('correct');
        if (state.suddenDeath) {
          // Sudden Death: a correct answer wins the match outright — no bonus round.
          endMatch(t);
        } else {
          state.bonus = { active: true, team: t, count: 0, nominatedId: null, nominatedName: null };
          state.phase = 'bonus';
          state.currentBuzz = null;
          state.buzzLockedAll = true;
          state.lockoutTeams = { A: false, B: false };
        }
        pushState();
      }
      break;

    case 'admin:starterIncorrect':       // "Interrupt Incorrect (-5)"
      if (handleStarterWrong(5)) pushState();
      break;

    case 'admin:starterIncorrectZero':   // "Starter Incorrect (0)" — wrong, no deduction
      if (handleStarterWrong(0)) pushState();
      break;

    case 'admin:nominate':
      if (state.bonus.active) {
        const team = state.teams[state.bonus.team];
        const p = team.players.find((pl) => pl.id === msg.playerId);
        if (p) { state.bonus.nominatedId = p.id; state.bonus.nominatedName = p.name; }
        pushState();
      }
      break;

    case 'admin:bonusCorrect':
      if (state.bonus.active) {
        state.teams[state.bonus.team].score += 5;
        playSound('correct');
        advanceBonusCounter();
        pushState();
      }
      break;

    case 'admin:bonusMiss':
      if (state.bonus.active) {
        playSound('wrong');
        advanceBonusCounter();
        pushState();
      }
      break;

    // [⏭️ Skip / No Answer]: clears all buzzer lockouts, increments the
    // Question Number, and resets to a fresh Starter Round. Works from any
    // phase (including mid-Bonus), synced instantly to every screen.
    case 'admin:skip':
      freshStarterRound(true);
      pushState();
      break;

    // [🔄 Manual Override / Force Reset]: a panic button — instantly unlocks
    // every player buzzer and returns to a fresh Starter Round WITHOUT
    // touching scores or the Question Number.
    case 'admin:forceReset':
      freshStarterRound(false);
      pushState();
      break;

    case 'admin:startTimer':
      if (state.timer.remainingSeconds <= 0) state.timer.remainingSeconds = state.timer.totalSeconds;
      state.timer.running = true;
      pushState();
      break;

    case 'admin:pauseTimer':
      state.timer.running = false;
      pushState();
      break;

    case 'admin:setTimer':
      if (Number.isFinite(msg.totalSeconds)) {
        const secs = Math.max(0, Math.round(msg.totalSeconds));
        state.timer = freshTimer(secs);
        pushState();
      }
      break;

    case 'admin:setQuestionNumber':
      if (Number.isFinite(msg.value)) {
        state.questionNumber = Math.max(1, Math.round(msg.value));
        pushState();
      }
      break;

    // Tournament Round Selector — broadcast to every connected Stage, Host
    // (Quiz Master) and Spectator device, and also what the End-of-Game
    // Celebration reads to pick its visual tier (see viewCeremony/
    // viewCeremonyStandard/viewCeremonyBronze/viewCeremonyGold).
    case 'admin:setTournamentRound':
      if (TOURNAMENT_ROUNDS.includes(msg.round)) {
        state.tournamentRound = msg.round;
        pushState();
      }
      break;

    case 'admin:newMatch':
      state.teams.A.score = 0;
      state.teams.B.score = 0;
      state.matchOver = false;
      state.winner = null;
      state.suddenDeath = false;
      state.questionNumber = 1;
      state.timer = freshTimer(state.timer.totalSeconds);
      // Keep the configured media-cue timestamps for the new match, just re-arm them.
      state.mediaSchedule.forEach((entry) => { entry.fired = false; entry.dismissed = false; });
      state.mediaWarning = null;
      state.mediaAlert = null;
      freshStarterRound(false);
      pushState();
      break;

    case 'admin:addMediaTrigger':
      if (Number.isFinite(msg.atSeconds) && (msg.kind === 'picture' || msg.kind === 'audio')) {
        state.mediaSchedule.push({
          id: uid(),
          atSeconds: Math.max(0, Math.round(msg.atSeconds)),
          kind: msg.kind,
          assetIndex: Number.isFinite(msg.assetIndex) ? Math.round(msg.assetIndex) : 0,
          fired: false,
          dismissed: false,
        });
        state.mediaSchedule.sort((x, y) => y.atSeconds - x.atSeconds);
        pushState();
      }
      break;

    case 'admin:removeMediaTrigger':
      state.mediaSchedule = state.mediaSchedule.filter((e) => e.id !== msg.id);
      if (state.mediaWarning && state.mediaWarning.id === msg.id) state.mediaWarning = null;
      if (state.mediaAlert && state.mediaAlert.id === msg.id) state.mediaAlert = null;
      pushState();
      break;

    case 'admin:dismissMediaTrigger': {
      const entry = state.mediaSchedule.find((e) => e.id === msg.id);
      if (entry && !entry.fired) {
        // Not fired yet — this is a genuine "postpone": stop it from auto-firing.
        entry.dismissed = true;
        if (state.mediaWarning && state.mediaWarning.id === msg.id) state.mediaWarning = null;
      }
      // Already fired (or no matching entry) — this just acknowledges/clears the
      // banner. The media that already went out to the Stage stays as-is.
      if (state.mediaAlert && state.mediaAlert.id === msg.id) state.mediaAlert = null;
      pushState();
      break;
    }

    case 'player:join': {
      const team = state.teams[msg.team];
      let p = team.players.find((pl) => pl.name.toLowerCase() === String(msg.name).toLowerCase());
      if (!p) { p = { id: uid(), name: msg.name, isCaptain: false, connPeerId: null }; team.players.push(p); }
      Object.values(state.teams).forEach((t) => t.players.forEach((pl) => { if (pl.connPeerId === msg.__fromPeer) pl.connPeerId = null; }));
      p.connPeerId = msg.__fromPeer;
      sendTo(msg.__fromPeer, { type: 'joined', team: msg.team, playerId: p.id, playerName: p.name, isCaptain: p.isCaptain });
      pushState();
      break;
    }

    case 'player:buzz': {
      if (state.matchOver) break;
      if (state.phase !== 'starter') break;
      if (state.buzzLockedAll || state.currentBuzz) break;
      const found = findPlayerByConn(msg.__fromPeer);
      if (!found) break;
      if (state.lockoutTeams[found.team]) break;
      state.currentBuzz = { team: found.team, playerId: found.player.id, playerName: found.player.name, t: Date.now() };
      state.buzzLockedAll = true;
      playSound('buzz');
      pushState();
      break;
    }
  }
}

function pushState() {
  state.connectedCount = Object.keys(Net.conns).length;
  broadcast({ type: 'state', state });
  render();
}

// Targeted DOM update for the countdown display — used on EVERY tick, on both
// the host and every client, instead of a full render(). Full-innerHTML
// rebuilds every second (once per tick) were the cause of the visible page
// flicker: every button, panel and score card was being torn down and
// recreated 60 times a minute just so one number could change. This instead
// touches only the timer text nodes that are actually on screen right now.
function updateTimerDisplay(remainingSeconds) {
  if (state && state.timer) state.timer.remainingSeconds = remainingSeconds;
  const text = fmtTime(remainingSeconds);
  const urgent = !!(state && state.timer && state.timer.running && remainingSeconds <= 30);
  document.querySelectorAll('[data-timer-display]').forEach((el) => {
    if (el.textContent !== text) el.textContent = text;
    el.classList.toggle('text-rose-400', urgent);
    el.classList.toggle('alert-flash', urgent);
  });
}

// Runs only on the Stage/host device. Ticks the master timer once per second.
// When it reaches zero: sounds the Gong, then either ends the match (clear
// winner) or — on an exact tie — enters Sudden Death with a fresh, unlocked
// Starter Round.
//
// IMPORTANT: a plain per-second tick is the ONLY thing that happens most
// seconds, so most seconds must NOT call pushState() (full broadcast + full
// re-render on every connected screen) — that was the root cause of the
// flicker. Instead we mutate the countdown, push a single tiny 'timerTick'
// message, and update this device's own timer text directly. A full
// pushState() only happens when something else actually changed this tick —
// a media-scheduler warning/alert firing, or the timer hitting zero — because
// those DO change layout (a banner appears, the picture overlay pops, the
// match ends) and every connected screen needs the full state to render that.
function startHostTimerLoop() {
  if (hostTimerIntervalId) return;
  hostTimerIntervalId = setInterval(() => {
    if (Net.role !== 'host' || !state || state.matchOver) return;
    if (!state.timer.running) return;
    state.timer.remainingSeconds = Math.max(0, state.timer.remainingSeconds - 1);
    const rem = state.timer.remainingSeconds;
    let needsFullUpdate = false; // true only when more than the ticking number changed

    // Time-Based Picture & Audio Round Scheduler — checked against the exact
    // countdown value the crew is watching on the Master Match Timer.
    state.mediaSchedule.forEach((entry) => {
      if (entry.dismissed || entry.fired) return;
      if (rem === entry.atSeconds + 30) {
        state.mediaWarning = { id: entry.id, kind: entry.kind, assetIndex: entry.assetIndex, atSeconds: entry.atSeconds };
        needsFullUpdate = true; // amber warning banner needs to appear
      }
      if (rem === entry.atSeconds) {
        entry.fired = true;
        state.mediaWarning = null;
        // No media is ever pushed to Stage/Spectator — this app hosts no images
        // or audio. The cue is a text-only alert seen by Admin and Quiz Master
        // only (see viewAdmin/viewQuizMaster), telling the crew to trigger the
        // Picture/Audio round on their own external slides/software.
        state.mediaAlert = { id: entry.id, kind: entry.kind, assetIndex: entry.assetIndex, atSeconds: entry.atSeconds };
        needsFullUpdate = true; // red alert banner needs to appear on Admin + Quiz Master
      }
    });

    if (rem === 0) {
      state.timer.running = false;
      playSound('gong');
      const a = state.teams.A.score, b = state.teams.B.score;
      if (a === b) {
        state.suddenDeath = true;
        freshStarterRound(true);
      } else {
        endMatch(a > b ? 'A' : 'B');
      }
      needsFullUpdate = true; // Gong event — match/round state changed, always full
    }

    if (needsFullUpdate) {
      pushState(); // full broadcast + full re-render, layout genuinely changed
    } else {
      updateTimerDisplay(rem);            // this device's own on-screen timer, targeted
      broadcast({ type: 'timerTick', remainingSeconds: rem }); // tiny payload, no re-render on clients either
    }
  }, 1000);
}

/* ------------------------------- app control -------------------------------- */

function goLauncher() {
  myRole = null;
  history.replaceState({}, '', baseUrl());
  render();
}

function launchStage(forcedRoomId) {
  // A forced room ID is used when this device is rebooting straight into a
  // pre-announced new room (see the FORCE_NEW_ROOM flow in hostHandleData
  // and the boot() IIFE below) — everyone else was already told this exact
  // ID before the reload, so the Host must land on the same one, not a new
  // random one.
  const roomId = forcedRoomId || makeRoomId();
  myRole = 'stage';
  myRoomId = roomId;
  state = initialState(roomId);
  render(); // show "starting..." first
  startHost(roomId, (err) => {
    if (err) { launchStage(); return; } // room id collision — retry with a fresh one
    Net.onData = hostHandleData;
    Net.onConnChange = () => { pushState(); };
    history.replaceState({}, '', joinUrl(roomId, 'stage'));
    startHostTimerLoop();
    render();
    // This callback runs directly from PeerJS's peer.on('open', ...) handler
    // (see startHost below) — paint the QR code right here, with a brief
    // retry loop in case the qrcodejs <script> is still loading.
    ensureQrLibraryThenPaint();
  });
}

// Shared by every non-Stage client (Admin, Player, Spectator, Quiz Master):
// the Host broadcasts this once, as part of the Admin-led "Force New Room"
// flow (see hostHandleData's FORCE_NEW_ROOM handling), with the one new Room
// ID everyone is moving to. Each screen redirects itself into that same room
// a beat later, using its own myRole, so the whole crew — Admin, Quiz Master,
// every Spectator screen and every Player buzzer — lands together in the
// next match's lobby instead of being left behind in a room the Host has
// already abandoned.
function handleRedirectToRoom(msg) {
  if (!msg || msg.type !== 'redirectToRoom' || !msg.roomId) return;
  clientLinkStatus = 'reconnecting';
  render();
  setTimeout(() => {
    window.location.href = joinUrl(msg.roomId, myRole);
  }, 200);
}

function launchAdmin(roomId) {
  myRole = 'admin';
  myRoomId = roomId.toUpperCase();
  clientLinkStatus = 'connecting';
  render();
  startClient(myRoomId, {
    onOpen: () => {
      clientLinkStatus = 'connected';
      sendToHost({ type: 'admin:hello' });
      history.replaceState({}, '', joinUrl(myRoomId, 'admin'));
      render();
    },
    onClose: () => { clientLinkStatus = 'reconnecting'; render(); },
  });
  Net.onData = (msg) => {
    if (msg.type === 'state') { state = msg.state; render(); }
    // Lightweight per-second tick — update just the on-screen countdown text,
    // never a full render(), so Admin doesn't flicker every second.
    if (msg.type === 'timerTick') { updateTimerDisplay(msg.remainingSeconds); }
    handleRedirectToRoom(msg);
  };
}

function launchPlayer(roomId) {
  myRole = 'player';
  myRoomId = roomId.toUpperCase();
  clientLinkStatus = 'connecting';
  render();
  startClient(myRoomId, {
    onOpen: () => {
      clientLinkStatus = 'connected';
      history.replaceState({}, '', joinUrl(myRoomId, 'player'));
      const saved = sessionStorage.getItem('uc_player_' + myRoomId);
      if (saved) {
        try {
          const p = JSON.parse(saved);
          sendToHost({ type: 'player:join', team: p.team, name: p.playerName });
        } catch (e) {}
      }
      render();
    },
    onClose: () => { clientLinkStatus = 'reconnecting'; render(); },
  });
  Net.onData = (msg) => {
    if (msg.type === 'state') { state = msg.state; render(); }
    // Player has no on-screen timer, but keep the mirrored state.timer in sync
    // (no full render(), so no flicker on the buzzer screen either).
    if (msg.type === 'timerTick') { updateTimerDisplay(msg.remainingSeconds); }
    if (msg.type === 'joined') {
      myPlayer = { team: msg.team, playerId: msg.playerId, playerName: msg.playerName, isCaptain: msg.isCaptain };
      sessionStorage.setItem('uc_player_' + myRoomId, JSON.stringify(myPlayer));
      render();
    }
    handleRedirectToRoom(msg);
  };
}

// A Spectator ("View Only") is a read-only mirror of the Stage View. Any number
// of these can connect to the host simultaneously — the host broadcasts every
// score change, buzzer lockout, nomination, timer tick and picture-round change
// to all of them (and every other connected device) at once, so many screens
// can display the live scoreboard in real time.
function launchSpectator(roomId) {
  myRole = 'spectator';
  myRoomId = roomId.toUpperCase();
  clientLinkStatus = 'connecting';
  render();
  startClient(myRoomId, {
    onOpen: () => {
      clientLinkStatus = 'connected';
      history.replaceState({}, '', joinUrl(myRoomId, 'spectator'));
      render();
      // Spectator renders the same Stage-view QR panel. This callback fires from
      // the client-side DataConnection's 'open' event (startClient's conn.on('open', ...)),
      // the client-side equivalent of the host's PeerJS 'open' event — paint here too,
      // with the same brief retry loop for a still-loading qrcodejs <script>.
      ensureQrLibraryThenPaint();
    },
    onClose: () => { clientLinkStatus = 'reconnecting'; render(); },
  });
  Net.onData = (msg) => {
    // The host always sends a full 'state' payload the instant this connection
    // opens (see startHost's conn.on('open', ...) handler), so a newly connected
    // or reconnected Spectator is synced up immediately with no extra handshake.
    if (msg.type === 'state') { state = msg.state; render(); }
    // Lightweight per-second tick — targeted DOM update only, no full render(),
    // so the Stage/Spectator display doesn't flicker every second.
    if (msg.type === 'timerTick') { updateTimerDisplay(msg.remainingSeconds); }
    handleRedirectToRoom(msg);
  };
}

// Quiz Master / Question Operator podium display (?role=host). A read-only
// client, like Spectator, but shows host-facing information instead of the
// audience scoreboard: timer, scores, a full-screen buzz alert, the nominated
// speaker, and a plain Current Question Number counter (no text/answer bank —
// questions are read from a printed script; media is cued through external
// presentation software).
function launchQuizMaster(roomId) {
  myRole = 'host';
  myRoomId = roomId.toUpperCase();
  clientLinkStatus = 'connecting';
  render();
  startClient(myRoomId, {
    onOpen: () => {
      clientLinkStatus = 'connected';
      history.replaceState({}, '', joinUrl(myRoomId, 'host'));
      render();
    },
    onClose: () => { clientLinkStatus = 'reconnecting'; render(); },
  });
  Net.onData = (msg) => {
    if (msg.type === 'state') { state = msg.state; render(); }
    // Lightweight per-second tick — update just the on-screen countdown text,
    // never a full render(), so the Quiz Master podium display doesn't flicker.
    if (msg.type === 'timerTick') { updateTimerDisplay(msg.remainingSeconds); }
    handleRedirectToRoom(msg);
  };
}

/* ---------------------------------- render ---------------------------------- */

const app = document.getElementById('app');

function render() {
  // Preserve whatever the crew is mid-typing across the full DOM rebuild below
  // (see the "Admin-only local draft state" block for why this matters).
  const savedFocus = captureFocus();
  renderInner();
  restoreFocus(savedFocus);
}

function renderInner() {
  if (!myRole) { app.innerHTML = viewLauncher(); wireLauncher(); return; }
  if (myRole === 'stage' || myRole === 'spectator') {
    app.innerHTML = viewStage(); wireStage(); paintQr(); syncOdometers(); return;
  }
  if (myRole === 'admin') { app.innerHTML = viewAdmin(); wireAdmin(); return; }
  if (myRole === 'host') { app.innerHTML = viewQuizMaster(); return; }
  if (myRole === 'player') { app.innerHTML = viewPlayer(); wirePlayer(); return; }
}

function wireLauncher() {
  document.getElementById('btn-stage').onclick = () => launchStage();
  let pendingRole = null;
  const form = document.getElementById('join-form');
  const openForm = (role) => { pendingRole = role; form.classList.remove('hidden'); document.getElementById('room-input').focus(); };
  document.getElementById('btn-admin').onclick = () => openForm('admin');
  document.getElementById('btn-player').onclick = () => openForm('player');
  document.getElementById('btn-spectator').onclick = () => openForm('spectator');
  document.getElementById('btn-quizmaster').onclick = () => openForm('quizmaster');
  const go = () => {
    const val = document.getElementById('room-input').value.trim();
    if (!val) { document.getElementById('join-error').classList.remove('hidden'); return; }
    if (pendingRole === 'admin') launchAdmin(val);
    else if (pendingRole === 'spectator') launchSpectator(val);
    else if (pendingRole === 'quizmaster') launchQuizMaster(val);
    else launchPlayer(val);
  };
  document.getElementById('join-go').onclick = go;
  document.getElementById('room-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
}

/* ----------------------------------- stage ------------------------------------ */

function phaseLabel() {
  if (state.bonus.active) return `BONUS ROUND — ${escapeHtml(state.teams[state.bonus.team].name)}`;
  if (state.currentBuzz) return 'BUZZ IN!';
  return 'STARTER ROUND';
}

function teamCardHtml(tk, compact) {
  compact = !!compact;
  const team = state.teams[tk];
  const isBuzzTeam = state.currentBuzz && state.currentBuzz.team === tk;
  const isBonusTeam = state.bonus.active && state.bonus.team === tk;
  const glow = isBuzzTeam ? 'buzz-glow' : (isBonusTeam ? 'ring-4 ring-sky-400/70' : 'ring-1 ring-white/10');
  const side = tk === 'A' ? 'items-start text-left' : 'items-end text-right';

  if (compact) {
    // Ultra-compact single-line roster: small inline chips, horizontally
    // scrollable if the roster is long, so the slim banner never grows tall.
    const chips = team.players.map((p) => {
      const speaking = isBonusTeam && state.bonus.nominatedId === p.id;
      const connected = !!p.connPeerId;
      return `<span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full whitespace-nowrap ${speaking ? 'bg-sky-500/30 text-sky-200 speak-pulse' : 'bg-white/5 text-neutral-300'}">
        <span class="inline-block w-1.5 h-1.5 rounded-full ${connected ? 'bg-emerald-400' : 'bg-neutral-600'}"></span>${p.isCaptain ? '👑' : ''}${escapeHtml(p.name)}

    }).join('') || `<span class="text-[10px] text-neutral-600 italic">No players</span>`;

    return `
    <div class="flex-1 min-w-0 flex flex-col ${side} gap-0.5 px-2 sm:px-3 ${glow === 'buzz-glow' ? 'buzz-glow rounded-xl' : ''}">

        <span class="font-display text-lg sm:text-xl leading-none truncate">${escapeHtml(team.name)}</span>
        <span class="score-slot"><span id="display-score${tk}" class="odometer score-mega-compact font-display text-4xl sm:text-5xl leading-none ${isBuzzTeam ? 'text-amber-300' : 'text-white'}">${team.score}</span></span>
      </div>
      <div class="compact-roster w-full ${tk === 'A' ? '' : 'justify-end'}">${chips}</div>
    </div>`;
  }

  const rosterHtml = team.players.map((p) => {
    const speaking = isBonusTeam && state.bonus.nominatedId === p.id;
    const connected = !!p.connPeerId;
    return `<div class="flex items-center gap-2 ${tk === 'A' ? '' : 'flex-row-reverse'} text-sm sm:text-base py-0.5">
      <span class="inline-block w-2 h-2 rounded-full ${connected ? 'bg-emerald-400' : 'bg-neutral-600'}"></span>
      <span class="${speaking ? 'text-sky-300 font-bold speak-pulse' : 'text-neutral-200'}">${p.isCaptain ? '👑 ' : ''}${escapeHtml(p.name)}</span>
      ${speaking ? '<span class="text-[10px] uppercase tracking-wider bg-sky-500/20 text-sky-300 px-1.5 py-0.5 rounded">📢 speaking...</span>' : ''}
    </div>`;
  }).join('') || `<div class="text-neutral-600 text-sm italic">No players yet</div>`;

  return `
  <div class="flex-1 flex flex-col ${side} gap-3 bg-black/40 rounded-3xl p-6 sm:p-8 ${glow} transition-all">
    <div class="uppercase text-xs tracking-[0.3em] text-neutral-400">${tk === 'A' ? 'Team A' : 'Team B'}</div>
    <div class="font-display text-3xl sm:text-4xl leading-none truncate max-w-full">${escapeHtml(team.name)}</div>
    <div class="score-slot">
      <div class="score-box min-w-[280px] ${isBuzzTeam ? 'score-box-active' : ''}">
        <span id="display-score${tk}" class="odometer score-mega font-display overflow-visible ${isBuzzTeam ? 'text-amber-300' : 'text-white'}">${team.score}</span>
      </div>
    </div>
    <div class="flex flex-col ${side} gap-0.5 mt-2 max-h-40 overflow-y-auto scrollbar-thin w-full">${rosterHtml}</div>

// Each team's primary color for the End-of-Game Celebration's glow/text
// accents (Case A) — a fixed, distinct identity per team slot.
function teamPrimaryColor(tk) {
  return tk === 'A' ? '#f59e0b' /* amber-400 */ : '#38bdf8' /* sky-400 */;
}

// Dynamic Divergent Celebration Logic — the Tournament Round Selector (set on
// Admin, broadcast to every device) decides which of three entirely different
// visual layouts plays when the match ends. This dispatcher is called from
// both viewStage() (Stage + Spectator) and viewQuizMaster() once
// state.matchOver is true.
function viewCeremony() {
  const round = state.tournamentRound || TOURNAMENT_ROUNDS[0];
  if (round === 'Third-Place Playoff') return viewCeremonyBronze();
  if (round === 'Grand Finals') return viewCeremonyGold();
  return viewCeremonyStandard(); // Qualifications / Quarterfinals / Semifinals
}

// CASE A — Qualifications / Quarterfinals / Semifinals: a bold text banner
// and a glowing border flash in the winning team's primary color. Deliberately
// no trophy/medal emojis — those are reserved for the Bronze/Gold tiers below.
function viewCeremonyStandard() {
  const winnerTeam = state.teams[state.winner];
  const color = teamPrimaryColor(state.winner);
  return `
  <div class="min-h-screen relative overflow-hidden bg-gradient-to-b from-neutral-950 via-neutral-900 to-black flex flex-col items-center justify-center text-center px-6 glow-border-flash" style="--glow-color:${color};">
    <div class="relative pop-in">
      <div class="font-display text-xl sm:text-2xl tracking-[0.4em] text-neutral-400 mb-3">${escapeHtml(state.tournamentRound)} — MATCH COMPLETE</div>
      <div class="font-display text-5xl sm:text-7xl leading-none mb-4" style="color:${color};">${escapeHtml(winnerTeam.name)} WINS THE MATCH!</div>
      <div class="flex items-center justify-center gap-8 font-display text-5xl sm:text-6xl">
        <div class="${state.winner === 'A' ? '' : 'text-neutral-500'}" style="${state.winner === 'A' ? `color:${color};` : ''}">${state.teams.A.score}</div>
        <div class="text-neutral-600 text-3xl">–</div>
        <div class="${state.winner === 'B' ? '' : 'text-neutral-500'}" style="${state.winner === 'B' ? `color:${color};` : ''}">${state.teams.B.score}</div>
      </div>
      <div class="flex justify-center gap-10 text-sm text-neutral-400 mt-2">
        <div>${escapeHtml(state.teams.A.name)}</div><div>${escapeHtml(state.teams.B.name)}</div>
      </div>
    </div>
  </div>`;
}

// CASE B — Third-Place Playoff: a dedicated metallic bronze (#CD7F32) themed
// victory layout, with floating bronze particle elements and bronze text
// shadows to sell the "3rd Place" tier.
function viewCeremonyBronze() {
  const winnerTeam = state.teams[state.winner];
  const particles = Array.from({ length: 40 }).map((_, i) => {
    const left = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 3).toFixed(2);

    const size = 6 + Math.round(Math.random() * 12);
    return `<span class="bronze-particle" style="left:${left}%;width:${size}px;height:${size}px;animation-delay:${delay}s;animation-duration:${dur}s;"></span>`;
  }).join('');
  return `
  <div class="min-h-screen relative overflow-hidden flex flex-col items-center justify-center text-center px-6" style="background:radial-gradient(ellipse at center, #4a2f18 0%, #1a1008 65%, #0a0603 100%);">

      <div class="font-display text-4xl sm:text-6xl md:text-7xl leading-tight mb-4 bronze-shimmer-text" style="color:#e8b27a;">🥉 3RD PLACE: ${escapeHtml(winnerTeam.name)} 🥉</div>
      <div class="flex items-center justify-center gap-8 font-display text-5xl sm:text-6xl" style="color:#e8b27a;">
        <div>${state.teams.A.score}</div>
        <div class="text-3xl" style="color:#CD7F32;">–</div>
        <div>${state.teams.B.score}</div>
      </div>
      <div class="flex justify-center gap-10 text-sm mt-2" style="color:#c99a68;">
        <div>${escapeHtml(state.teams.A.name)}</div><div>${escapeHtml(state.teams.B.name)}</div>
      </div>
    </div>
  </div>`;
}

// CASE C — Grand Finals: an ultra-premium, high-contrast bright gold
// (#FFD700) championship layout — a giant screen-wide banner plus a dense
// mix of floating gold star/trophy particles and gold confetti.
function viewCeremonyGold() {
  const winnerTeam = state.teams[state.winner];
  const symbols = ['⭐', '✨', '🏆', '🌟'];
  const particles = Array.from({ length: 70 }).map((_, i) => {
    const left = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 3).toFixed(2);
    const dur = (2.5 + Math.random() * 3.5).toFixed(2);
    const size = 14 + Math.round(Math.random() * 22);
    const sym = symbols[i % symbols.length];
    return `<span class="gold-particle" style="left:${left}%;font-size:${size}px;animation-delay:${delay}s;animation-duration:${dur}s;">${sym}</span>`;
  }).join('');
  const confetti = Array.from({ length: 50 }).map((_, i) => {
    const left = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 2.5).toFixed(2);
    const dur = (2.4 + Math.random() * 2.2).toFixed(2);
    const size = 8 + Math.round(Math.random() * 6);
    return `<span class="confetti-piece" style="left:${left}%;background:#FFD700;width:${size}px;height:${size * 1.4}px;animation-delay:${delay}s;animation-duration:${dur}s;"></span>`;
  }).join('');
  return `
  <div class="min-h-screen relative overflow-hidden flex flex-col items-center justify-center text-center px-6" style="background:radial-gradient(ellipse at center, #4d3a00 0%, #1a1400 65%, #050400 100%);">

      <div class="font-display text-4xl sm:text-6xl md:text-7xl leading-tight mb-4 gold-shimmer-text" style="color:#FFD700;">🏆 CHAMPION: ${escapeHtml(winnerTeam.name)} 🏆</div>
      <div class="flex items-center justify-center gap-8 font-display text-5xl sm:text-6xl" style="color:#FFD700;">
        <div>${state.teams.A.score}</div>
        <div class="text-3xl">–</div>
        <div>${state.teams.B.score}</div>
      </div>
      <div class="flex justify-center gap-10 text-sm mt-2" style="color:#e6c14d;">
        <div>${escapeHtml(state.teams.A.name)}</div><div>${escapeHtml(state.teams.B.name)}</div>
      </div>

function viewStage() {
  if (myRole === 'stage' && !myRoomId) {
    return `<div class="min-h-screen flex items-center justify-center"><p class="font-display text-3xl text-neutral-400 soft-pulse">Starting stage…</p></div>`;
  }
  if (myRole === 'spectator' && (clientLinkStatus !== 'connected' || !state)) {
    return `<div class="min-h-screen flex flex-col items-center justify-center gap-3 px-6 text-center">
      <p class="font-display text-3xl soft-pulse">${clientLinkStatus === 'reconnecting' ? 'Reconnecting to stage…' : 'Connecting to Room ' + myRoomId + '…'}</p>
      <p class="text-neutral-500 text-sm">Make sure the Stage View is running on Room <span class="text-neutral-300 font-semibold">${myRoomId}</span>.</p>
    </div>`;
  }
  if (!state) {
    return `<div class="min-h-screen flex items-center justify-center"><p class="font-display text-3xl text-neutral-400 soft-pulse">Loading…</p></div>`;
  }

  if (state.matchOver) return viewCeremony();

  const bgClass = stageChroma ? 'chroma-mode' : 'bg-neutral-950';
  const overlay = stageChroma ? '' : 'bg-black/55';
  const showBuzzBanner = !!state.currentBuzz;
  const buzzTeamName = showBuzzBanner ? state.teams[state.currentBuzz.team].name : '';
  const timerDanger = state.timer.running && state.timer.remainingSeconds <= 30;

  // -------- Compact Banner Mode: a slim, single-row strip for pinning at the
  // top of a projector/PowerToys layout. Headers, the QR footer and the full
  // roster lists are dropped to reclaim space. Stage/Spectator never receive
  // or display any Picture/Audio media or media-cue banner — those are text
  // alerts for Admin and Quiz Master only (see viewAdmin/viewQuizMaster). --------
  if (stageCompact) {
    let centerCompact;
    if (state.currentBuzz) {
      centerCompact = `<span class="text-xs sm:text-sm font-display text-amber-300 truncate max-w-[16ch]">${escapeHtml(state.currentBuzz.playerName)} buzzed!</span>`;
    } else if (state.bonus.active) {
      centerCompact = `<span class="text-xs sm:text-sm font-display text-sky-300 truncate max-w-[16ch]">BONUS ${Math.min(state.bonus.count + 1, 3)}/3</span>`;
    } else if (state.suddenDeath) {
      centerCompact = `<span class="text-xs sm:text-sm font-display text-rose-400 alert-flash whitespace-nowrap">🚨 SUDDEN DEATH</span>`;
    } else {
      centerCompact = `<span class="text-xs sm:text-sm font-display text-neutral-300 tracking-widest whitespace-nowrap">STARTER ROUND</span>`;
    }

    return `
    <div class="compact-shell flex ${bgClass} relative w-full">
      <div class="absolute inset-0 ${overlay}"></div>
      <div class="relative w-full h-full flex compact-row gap-2 sm:gap-4 px-3 sm:px-5">
        ${teamCardHtml('A', true)}
        <div class="flex flex-col items-center justify-center gap-0.5 shrink-0 px-1 sm:px-2">
          <div id="timer-display-compact" data-timer-display class="font-display tracking-[0.15em] text-lg sm:text-xl tabular-nums ${timerDanger ? 'text-rose-400 alert-flash' : 'text-neutral-300'}">${fmtTime(state.timer.remainingSeconds)}</div>
          ${centerCompact}
        </div>
        ${teamCardHtml('B', true)}
        <button id="compact-toggle" class="shrink-0 self-center border border-white/20 rounded-full px-2 py-1 text-[10px] hover:bg-white/10 whitespace-nowrap">Full Screen (B)</button>
      </div>
    </div>`;
  }

  let centerHtml;
  if (showBuzzBanner) {
    centerHtml = `
      <div class="pop-in text-center">
        <div class="font-display text-2xl sm:text-3xl text-neutral-300 tracking-widest mb-1">BUZZED IN</div>
        <div class="font-display text-5xl sm:text-6xl text-amber-300">${escapeHtml(state.currentBuzz.playerName)}</div>
        <div class="text-neutral-400 mt-1 text-lg">${escapeHtml(buzzTeamName)}</div>
      </div>`;
  } else if (state.bonus.active) {
    centerHtml = `
      <div class="pop-in text-center">
        <div class="font-display text-3xl sm:text-4xl text-sky-300 tracking-widest">BONUS ROUND</div>
        <div class="text-neutral-300 mt-2">${escapeHtml(state.teams[state.bonus.team].name)} · Question ${Math.min(state.bonus.count + 1, 3)} of 3</div>
        ${state.bonus.nominatedName ? `<div class="mt-3 inline-block bg-sky-500/20 text-sky-300 px-4 py-1.5 rounded-full text-sm speak-pulse">📢 ${escapeHtml(state.bonus.nominatedName)} is speaking</div>` : `<div class="mt-3 text-neutral-500 text-sm">Waiting for captain to nominate a speaker…</div>`}
      </div>`;
  } else {
    centerHtml = `
      <div class="pop-in text-center">
        <div class="font-display text-4xl sm:text-5xl text-neutral-200 tracking-widest">STARTER ROUND</div>
        <div class="text-neutral-500 mt-2 text-sm uppercase tracking-[0.3em] soft-pulse">Buzzers open</div>
      </div>`;
  }

  const suddenDeathBanner = state.suddenDeath ? `
    <div class="text-center py-2.5 px-4 rounded-xl bg-rose-600/20 border border-rose-500/60 text-rose-300 font-display text-xl sm:text-2xl tracking-widest alert-flash">
      🚨 SUDDEN DEATH: NEXT CORRECT ANSWER WINS!
    </div>` : '';

  return `
  <div class="min-h-screen flex flex-col ${bgClass} relative overflow-hidden">
    <div class="absolute inset-0 ${overlay}"></div>
    <div class="relative flex-1 flex flex-col p-4 sm:p-8 gap-4 sm:gap-5">
      <div class="flex items-center justify-between text-neutral-400 text-xs sm:text-sm">
        <div class="flex items-center gap-3">
          <span class="font-display tracking-[0.3em] text-neutral-300">${phaseLabel()}</span>
          <span class="px-2 py-0.5 rounded-full bg-amber-400/15 text-amber-300 text-[11px] uppercase tracking-wider whitespace-nowrap">${escapeHtml(state.tournamentRound)}</span>
        </div>
        <div class="flex items-center gap-3">
          ${myRole === 'spectator' ? '<span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 text-[11px] uppercase tracking-wider">View Only</span>' : ''}

// Draws the join-link QR code using qrcodejs (davidshimjs), which renders by
// appending an <img>/<canvas> into a container element — it does not draw
// into a pre-existing <canvas> like the old "qrcode" package did. Uses the
// library's own documented two-argument constructor form:
//   new QRCode(document.getElementById("element-id"), text)
function paintQr() {
  const container = document.getElementById('qr-canvas');
  if (!container || !state) return;
  const mode = window.qrmode || 'player';
  const url = joinUrl(state.roomId, mode);
  const fallback = () => {
    container.innerHTML = `<div class="w-full h-full flex items-center justify-center text-center text-[10px] text-neutral-700 p-2 break-all">${escapeHtml(url)}</div>`;
  };
  if (typeof QRCode === 'undefined') {
    // Script hasn't loaded yet (or failed to, e.g. offline) — show the raw
    // link so the room code stays visibly, verifiably tied to a scannable/
    // copyable target. ensureQrLibraryThenPaint() (called from the PeerJS
    // 'open' handler) will repaint automatically once the library arrives.
    fallback();
    return;
  }
  container.innerHTML = ''; // fresh container each render — clear any prior fallback text
  try {
    new QRCode(document.getElementById('qr-canvas'), url);
  } catch (e) {
    fallback();
  }
}

// Called right from the PeerJS host's 'open' event (see launchStage). If the
// qrcodejs <script> tag is still loading at that moment — a real race on a
// cold Vercel edge request — this polls briefly until the QRCode global
// exists, then paints, instead of silently leaving the fallback text up.
function ensureQrLibraryThenPaint(retriesLeft) {
  if (typeof retriesLeft !== 'number') retriesLeft = 25; // ~5s at 200ms intervals
  if (typeof QRCode !== 'undefined') { paintQr(); return; }
  if (retriesLeft <= 0) return;
  setTimeout(() => ensureQrLibraryThenPaint(retriesLeft - 1), 200);
}

// Odometer.js wiring: since render() rebuilds the DOM from scratch on every
// state change, a freshly created Odometer instance is seeded with the *last*
// score it displayed and then, one frame later, told to `.update()` to the
// *new* score — that transition is what actually plays the rolling-digit
// animation, even though the underlying DOM node is brand new each time.
let lastScoreA = null;
let lastScoreB = null;
function syncOdometers() {
  if (!state || state.matchOver || typeof Odometer === 'undefined') return;
  const elA = document.getElementById('display-scoreA');
  const elB = document.getElementById('display-scoreB');
  if (!elA || !elB) return;
  const newA = state.teams.A.score;
  const newB = state.teams.B.score;
  const firstPaint = (lastScoreA === null);
  const odA = new Odometer({ el: elA, value: firstPaint ? newA : lastScoreA, format: 'd', duration: 600, theme: 'default' });
  const odB = new Odometer({ el: elB, value: firstPaint ? newB : lastScoreB, format: 'd', duration: 600, theme: 'default' });
  if (!firstPaint) {
    requestAnimationFrame(() => { odA.update(newA); odB.update(newB); });
  }
  lastScoreA = newA;
  lastScoreB = newB;
}

function wireStage() {
  const chromaBtn = document.getElementById('chroma-toggle');
  if (chromaBtn) chromaBtn.onclick = () => { stageChroma = !stageChroma; localStorage.setItem('uc_chroma', stageChroma ? '1' : '0'); render(); };

  const compactBtn = document.getElementById('compact-toggle');
  if (compactBtn) compactBtn.onclick = () => { stageCompact = !stageCompact; localStorage.setItem('uc_compact', stageCompact ? '1' : '0'); render(); };

  document.querySelectorAll('[data-qr-mode]').forEach((btn) => {
    btn.onclick = () => { window.qrmode = btn.getAttribute('data-qr-mode'); render(); };
  });
  const copyBtn = document.getElementById('qr-copy-link');
  if (copyBtn && state) {
    copyBtn.onclick = () => {
      const url = joinUrl(state.roomId, window.qrmode || 'player');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = `Copy ${window.qrmode || 'player'} link`; }, 1200);
        }).catch(() => {});
      }
    };
  }

  // Hotkeys are bound once, globally. 'C' (background) and 'B' (compact banner)
  // are purely local display choices, so they work on the Stage and on every
  // Spectator screen independently. Space (skip to next starter) mutates the
  // shared game state, so it only takes effect on the Stage device — the
  // actual host. (Picture-round hotkeys have been removed along with all
  // image-rendering logic — Picture/Audio rounds now run entirely on external
  // slides/software, cued only by the text alerts on Admin and Quiz Master.)
  if (!window.__ucKeysBound) {
    window.__ucKeysBound = true;
    window.addEventListener('keydown', (e) => {
      if ((myRole !== 'stage' && myRole !== 'spectator') || !state) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'c' || e.key === 'C') { stageChroma = !stageChroma; localStorage.setItem('uc_chroma', stageChroma ? '1' : '0'); render(); }
      if (e.key === 'b' || e.key === 'B') { stageCompact = !stageCompact; localStorage.setItem('uc_compact', stageCompact ? '1' : '0'); render(); }
      if (myRole !== 'stage') return;
      if (e.code === 'Space') { e.preventDefault(); hostHandleData({ type: 'admin:skip' }); }
    });
  }
}

function wireAdmin() {
  if (clientLinkStatus !== 'connected' || !state) return;
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

  if (state.matchOver) {
    // Raw { action: "FORCE_NEW_ROOM" } payload — deliberately not wrapped in
    // the usual { type: 'admin:...' } envelope, per spec — sent straight to
    // the Host via the existing hostConn data channel.
    on('btn-force-new-room', () => sendToHost({ action: 'FORCE_NEW_ROOM' }));
    return;
  }

  on('btn-starter-correct', () => sendToHost({ type: 'admin:starterCorrect' }));
  on('btn-starter-incorrect', () => sendToHost({ type: 'admin:starterIncorrect' }));
  on('btn-starter-incorrect-zero', () => sendToHost({ type: 'admin:starterIncorrectZero' }));
  on('btn-bonus-correct', () => sendToHost({ type: 'admin:bonusCorrect' }));
  on('btn-bonus-miss', () => sendToHost({ type: 'admin:bonusMiss' }));
  on('btn-skip', () => sendToHost({ type: 'admin:skip' }));
  on('btn-force-reset', () => sendToHost({ type: 'admin:forceReset' }));
  on('btn-q-prev', () => sendToHost({ type: 'admin:setQuestionNumber', value: state.questionNumber - 1 }));
  on('btn-q-next', () => sendToHost({ type: 'admin:setQuestionNumber', value: state.questionNumber + 1 }));
  const roundSelect = document.getElementById('tournament-round-select');
  if (roundSelect) roundSelect.onchange = () => sendToHost({ type: 'admin:setTournamentRound', round: roundSelect.value });
  on('btn-timer-start', () => sendToHost({ type: 'admin:startTimer' }));
  on('btn-timer-pause', () => sendToHost({ type: 'admin:pauseTimer' }));
  on('btn-timer-edit', () => { const f = document.getElementById('timer-edit-form'); if (f) f.classList.toggle('hidden'); });
  on('btn-timer-save', () => {
    const m = parseInt(document.getElementById('timer-minutes').value, 10) || 0;
    const s = parseInt(document.getElementById('timer-seconds').value, 10) || 0;
    sendToHost({ type: 'admin:setTimer', totalSeconds: Math.max(0, m * 60 + s) });
    document.getElementById('timer-edit-form').classList.add('hidden');
  });

  document.querySelectorAll('[data-score]').forEach((btn) => {
    btn.onclick = () => {
      const [team, delta] = btn.getAttribute('data-score').split(':');
      sendToHost({ type: 'admin:adjustScore', team, delta: parseInt(delta, 10) });
    };
  });
  document.querySelectorAll('[data-set-score-btn]').forEach((btn) => {
    btn.onclick = () => {
      const tk = btn.getAttribute('data-set-score-btn');
      const input = document.querySelector(`[data-set-score-input="${tk}"]`);
      const val = parseInt(input.value, 10);
      if (!isNaN(val)) sendToHost({ type: 'admin:setScoreAbsolute', team: tk, value: val });
    };
  });
  document.querySelectorAll('[data-nominate]').forEach((btn) => {
    btn.onclick = () => sendToHost({ type: 'admin:nominate', playerId: btn.getAttribute('data-nominate') });
  });

  // ---- Persistent roster drafts: typing only ever updates the local draft
  // object, never sends anything or triggers a re-render, so the DOM node the
  // crew is typing into is left completely alone — and the once-a-second
  // broadcast re-render can't wipe it out because the render reads its value
  // straight back out of this same draft on the next rebuild.
  ensureRosterDraft();
  document.querySelectorAll('[data-team-name]').forEach((input) => {
    const tk = input.getAttribute('data-team-name');
    input.oninput = () => { rosterDraft[tk].name = input.value; };
  });
  document.querySelectorAll('[data-roster]').forEach((ta) => {
    const tk = ta.getAttribute('data-roster');
    ta.oninput = () => { rosterDraft[tk].rosterText = ta.value; };
  });
  document.querySelectorAll('[data-captain]').forEach((radio) => {
    radio.onchange = () => { rosterDraft[radio.getAttribute('data-captain')].captainId = radio.value; };
  });
  document.querySelectorAll('[data-reload-roster]').forEach((btn) => {
    btn.onclick = () => {
      const tk = btn.getAttribute('data-reload-roster');
      rosterDraft[tk] = null; // cleared -> ensureRosterDraft reseeds straight from live state
      render();
    };
  });
  on('btn-broadcast-roster', () => {
    ['A', 'B'].forEach((tk) => {
      const draft = rosterDraft[tk];
      if (!draft) return;
      const names = draft.rosterText.split('\n').map((s) => s.trim()).filter(Boolean);
      sendToHost({ type: 'admin:setTeamName', team: tk, name: draft.name });
      sendToHost({ type: 'admin:setRoster', team: tk, names });
      if (draft.captainId) sendToHost({ type: 'admin:setCaptain', team: tk, playerId: draft.captainId });
    });
  });

  // ---- Media Automation & Schedule Scheduler + Live Alerts ------------------
  on('btn-sched-add', () => {
    const minEl = document.getElementById('sched-min');
    const secEl = document.getElementById('sched-sec');
    const kindEl = document.getElementById('sched-kind');
    const assetEl = document.getElementById('sched-asset');
    const mins = parseInt(minEl.value, 10) || 0;
    const secs = parseInt(secEl.value, 10) || 0;
    const atSeconds = Math.max(0, mins * 60 + secs);
    const kind = kindEl.value === 'audio' ? 'audio' : 'picture';
    const assetIndex = parseInt(assetEl.value, 10) || 0;
    sendToHost({ type: 'admin:addMediaTrigger', atSeconds, kind, assetIndex });
    schedDraft = { atMinutes: '', atSeconds: '', kind, assetIndex: String(assetIndex) };
  });
  document.querySelectorAll('[data-remove-media]').forEach((btn) => {
    btn.onclick = () => sendToHost({ type: 'admin:removeMediaTrigger', id: btn.getAttribute('data-remove-media') });
  });
  document.querySelectorAll('[data-dismiss-media]').forEach((btn) => {
    btn.onclick = () => sendToHost({ type: 'admin:dismissMediaTrigger', id: btn.getAttribute('data-dismiss-media') });
  });
  const schedMinEl = document.getElementById('sched-min');
  const schedSecEl = document.getElementById('sched-sec');
  const schedKindEl = document.getElementById('sched-kind');
  const schedAssetEl = document.getElementById('sched-asset');
  if (schedMinEl) schedMinEl.oninput = () => { schedDraft.atMinutes = schedMinEl.value; };
  if (schedSecEl) schedSecEl.oninput = () => { schedDraft.atSeconds = schedSecEl.value; };
  if (schedKindEl) schedKindEl.onchange = () => { schedDraft.kind = schedKindEl.value; };
  if (schedAssetEl) schedAssetEl.oninput = () => { schedDraft.assetIndex = schedAssetEl.value; };
}

      <div class="font-display text-2xl tracking-widest mb-2">BUZZED IN</div>

    </div>

        <div class="font-display text-6xl tabular-nums">${state.teams.B.score}</div>

    <div class="mt-auto bg-neutral-900 border border-neutral-800 rounded-2xl p-4 text-center">
