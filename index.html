function viewPlayer() {
  if (clientLinkStatus !== 'connected' || !state) {
    return `<div class="min-h-screen flex flex-col items-center justify-center gap-3 px-6 text-center">
      <p class="font-display text-3xl soft-pulse">${clientLinkStatus === 'reconnecting' ? 'Reconnecting…' : 'Connecting to Room ' + myRoomId + '…'}</p>
    </div>`;
  }

  if (state.matchOver) {
    const winnerTeam = state.teams[state.winner];
    return `<div class="min-h-screen flex flex-col items-center justify-center gap-3 px-6 text-center bg-neutral-950">
      <div class="font-display text-3xl">🏆 ${escapeHtml(winnerTeam.name)} wins!</div>
      <div class="text-neutral-400">${state.teams.A.score} – ${state.teams.B.score}</div>
    </div>`;
  }

  if (!myPlayer) {
    const teamOptA = state.teams.A.players.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    return `
    <div class="min-h-screen flex flex-col items-center justify-center px-6 fade-in">
      <div class="w-full max-w-sm bg-neutral-900 border border-neutral-800 rounded-2xl p-6">
        <h1 class="font-display text-3xl text-center mb-1">Join the Game</h1>
        <p class="text-neutral-500 text-sm text-center mb-5">Room ${state.roomId}</p>
        <label class="text-xs uppercase tracking-wider text-neutral-400">Your team</label>
        <select id="sel-team" class="mt-1 w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-3 focus:outline-none focus:border-amber-400">
          <option value="A">${escapeHtml(state.teams.A.name)}</option>
          <option value="B">${escapeHtml(state.teams.B.name)}</option>
        </select>
        <label class="text-xs uppercase tracking-wider text-neutral-400 mt-4 block">Your name</label>
        <select id="sel-name" class="mt-1 w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-3 focus:outline-none focus:border-amber-400">
          <option value="" disabled selected>Select your name…</option>
          <span data-optgroup-a>${teamOptA}</span>
        </select>
        <p class="text-neutral-600 text-xs mt-2">Not on the list? Ask the Controller to add you to the roster first.</p>
        <button id="btn-join" class="mt-5 w-full bg-amber-400 text-black font-bold rounded-xl py-3 btn-press">Join Team</button>
      </div>
    </div>`;
  }

  const team = state.teams[myPlayer.team];
  const disabled = state.matchOver || state.phase !== 'starter' || state.buzzLockedAll || state.lockoutTeams[myPlayer.team] || !!state.currentBuzz;
  let reason = '';
  if (state.bonus.active) reason = 'Bonus round in progress';
  else if (state.currentBuzz && state.currentBuzz.playerId === myPlayer.playerId) reason = 'You buzzed in!';
  else if (state.currentBuzz) reason = 'Someone already buzzed';
  else if (state.lockoutTeams[myPlayer.team]) reason = 'Your team is locked out this question';
  else reason = 'Tap to buzz in';

  const iBuzzedFirst = state.currentBuzz && state.currentBuzz.playerId === myPlayer.playerId;

  return `
  <div class="min-h-screen flex flex-col bg-neutral-950">
    <div class="p-4 flex items-center justify-between text-sm">
      <div>
        <div class="text-neutral-500 text-xs">${escapeHtml(team.name)}</div>
        <div class="font-bold">${escapeHtml(myPlayer.playerName)}</div>
      </div>
      <div class="px-3 py-1 rounded-full text-xs font-semibold ${myPlayer.isCaptain ? 'bg-amber-400 text-black' : 'bg-neutral-800 text-neutral-300'}">${myPlayer.isCaptain ? '👑 Team Captain' : 'Team Member'}</div>
    </div>
    ${state.suddenDeath ? '<div class="mx-4 mb-2 text-center py-2 rounded-lg bg-rose-600/20 border border-rose-500/50 text-rose-300 text-xs font-bold uppercase tracking-wider alert-flash">🚨 Sudden Death — next correct answer wins!</div>' : ''}
    <button id="buzz-btn" ${disabled ? 'disabled' : ''} class="buzzer-btn flex-1 m-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-colors
      ${iBuzzedFirst ? 'bg-amber-400 text-black' : disabled ? 'bg-neutral-800 text-neutral-500' : 'bg-rose-600 active:bg-rose-500 text-white'}">
      <span class="font-display text-6xl sm:text-7xl">${iBuzzedFirst ? 'GOT IT!' : disabled ? 'LOCKED' : 'BUZZ'}</span>
      <span class="text-sm sm:text-base opacity-80 px-6 text-center">${escapeHtml(reason)}</span>
    </button>
    <div class="px-4 pb-4 text-center text-neutral-600 text-xs">Score — ${escapeHtml(state.teams.A.name)} ${state.teams.A.score} : ${state.teams.B.score} ${escapeHtml(state.teams.B.name)}</div>
  </div>`;
}

function wirePlayer() {
  if (!state) return;
  if (!myPlayer) {
    const selTeam = document.getElementById('sel-team');
    const selName = document.getElementById('sel-name');
    if (!selTeam) return;
    const refreshNames = () => {
      const tk = selTeam.value;
      const players = state.teams[tk].players;
      selName.innerHTML = '<option value="" disabled selected>Select your name…</option>' +
        players.map((p) => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('');
    };
    selTeam.onchange = refreshNames;
    refreshNames();
    document.getElementById('btn-join').onclick = () => {
      const tk = selTeam.value;
      const name = selName.value;
      if (!name) return;
      sendToHost({ type: 'player:join', team: tk, name });
    };
    return;
  }
  const btn = document.getElementById('buzz-btn');
  if (btn && !btn.disabled) {
    // Zero-click-delay buzzer: 'touchstart' fires the instant a finger touches
    // the screen, bypassing the ~300ms 'click' delay mobile browsers used to
    // impose while waiting to see if the tap becomes a double-tap-to-zoom
    // gesture (also disabled outright via `touch-action: manipulation` in the
    // CSS above). 'mousedown' is the fallback for non-touch devices/testing.
    // A local `fired` flag stops a touch's synthetic mouse events — or a
    // touch+mouse hybrid device — from sending the buzz twice.
    let fired = false;
    const fire = (e) => {
      if (fired) return;
      fired = true;
      if (e && e.cancelable) e.preventDefault();
      btn.disabled = true;
      btn.classList.add('opacity-80');
      try { ctx(); } catch (err) {}
      sendBuzzToHost(); // minimal 'B' payload — see sendBuzzToHost()
    };
    btn.addEventListener('touchstart', fire, { passive: false });
    btn.addEventListener('mousedown', fire);
  }
}

/* ------------------------------------ boot -------------------------------------- */

window.qrmode = 'player';

(function boot() {
  const room = qs('room');
  const role = qs('role');
  if (room && role === 'admin') { launchAdmin(room); return; }
  if (room && role === 'player') { launchPlayer(room); return; }
  if (room && role === 'spectator') { launchSpectator(room); return; }
  if (room && role === 'host') { launchQuizMaster(room); return; }
  // Force New Room redirect landing: the Host was sent here by its own
  // FORCE_NEW_ROOM handler (see hostHandleData) with the exact new Room ID
  // already decided and already broadcast to every other screen, so it must
  // boot straight into that same room rather than minting another random one.
  if (room && role === 'stage') { launchStage(room); return; }
  render();
})();
</script>
